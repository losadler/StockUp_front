<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="color-scheme" content="light dark">
    <title>Stock Up</title>
    <link rel="stylesheet" href="lib/framework7/framework7-bundle.css">
    <link rel="stylesheet" href="css/icons.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <div id="app">

        <div class="statusbar"></div>

        <div class="view view-main">

            <!-- Navbar con id para control -->
            <div id="app-navbar" class="navbar">
                <div class="navbar-bg bg-color-blue"></div>
                <div class="navbar-inner bg-color-blue">
                    <div class="left">
                        <div class="title"><a href='/inicio/'>Stock Up</a></div>
                    </div>
                    <div class="right">
                        <a href='/compras/'><i class="f7-icons">cart_fill</i></a>
                        <div class="block block-strong-ios block-outline-ios">
                            <p class="grid grid-cols-2 grid-gap">
                                <a href="#" data-panel=".panel-right" class="panel-open">
                                    <i class="f7-icons ellipsis-btn">ellipsis_vertical</i>
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Panel derecho con id -->
            <div id="app-panel" class="panel panel-right panel-cover panel-init">
                <div class="block">
                    <a href='/cuenta/'><button class="button color-blue panel-close">Mi cuenta</button></a>
                    <br>
                    <a href='/negocio/'><button class="button color-blue panel-close">Mi negocio</button></a>
                    <br>
                    <a href='/registrarnegocio/'><button class="button color-blue panel-close">Registrar mi
                            negocio</button></a>
                    <br><br>
                    <a href="#" class="panel-close"><button class="button color-red panel-close">Volver</button></a>
                </div>
            </div>

            <!-- Toolbar / tabbar con id -->
            <div id="app-toolbar" class="toolbar tabbar-icons toolbar-bottom">
                <div class="toolbar-inner">
                    <a href="/tarjetas/" class="tab-link tab-link-active">
                        <i class="f7-icons">creditcard</i>
                        <span class="tabbar-label">Mis Tarjetas</span>
                    </a>
                    <a href="/compras/" class="tab-link">
                        <i class="f7-icons">cart</i>
                        <span class="tabbar-label">Mis compras</span>
                    </a>
                    <a href="/favoritos/" class="tab-link">
                        <i class="f7-icons">star</i>
                        <span class="tabbar-label">Mis favoritos</span>
                    </a>
                    <a href="/cuenta/" class="tab-link">
                        <i class="f7-icons">person_crop_circle_fill</i>
                        <span class="tabbar-label">Mi perfil</span>
                    </a>
                </div>
            </div>

            <!-- Página index/login -->
            <div data-name="index" class="page">
                <div class="page-content">
                    <div class="block">
                        <div class="centro">
                            <h1>¡BIENVENIDO A STOCKUP!</h1>
                        </div>
                        <div class="list list-strong-ios list-dividers-ios inset-ios">
                            <ul>
                                <li class="item-content item-input">
                                    <div class="item-inner">
                                        <div class="item-title item-label">E-mail</div>
                                        <div class="item-input-wrap">
                                            <input type="email" id="emaillog" placeholder="Introduce tu correo">
                                            <span class="input-clear-button"></span>
                                        </div>
                                    </div>
                                </li>
                                <li class="item-content item-input">
                                    <div class="item-inner">
                                        <div class="item-title item-label">Clave</div>
                                        <div class="item-input-wrap">
                                            <input type="password" id="passwordlog"
                                                placeholder="Introduce tu contraseña">
                                            <span class="input-clear-button"></span>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        <a href='/olvidecontrasenia/'><button class="button color-blue">¿Olvidaste tu
                                contraseña?</button></a>
                        <br>
                        <button class="button button-fill button-round" id="botonlogin">Iniciar sesión</button>
                        <br><br>
                        <div class="centro">
                            <p>¿Todavía no tienes una cuenta?</p>
                        </div>
                        <a href='/registro/'><button class="button color-blue">Registrarse</button></a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script type="text/javascript" src="cordova.js"></script>
    <script type="text/javascript" src="lib/framework7/framework7-bundle.min.js"></script>

    <!-- Este es el único archivo JS que necesitamos ahora: -->
    <script type="text/javascript" src="js/my-app.js"></script>





</body>

</html>

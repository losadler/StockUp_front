<!DOCTYPE html>
<html>

<head>
    <!--
        Customize this policy to fit your own app's needs. For more guidance, see:
            https://github.com/apache/cordova-plugin-whitelist/blob/master/README.md#content-security-policy
        Some notes:
            * gap: is required only on iOS (when using UIWebView) and is needed for JS->native communication
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
-->
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <!-- Color theme for statusbar -->
    <!-- <meta name="theme-color" content="#2196f3"> -->
    <meta name="color-scheme" content="light dark">

    <!-- Your app title -->
    <title>My App</title>
    <!-- Path to Framework7 Library CSS -->
    <link rel="stylesheet" href="lib/framework7/framework7-bundle.css">
    <!-- Path to icons -->
    <link rel="stylesheet" href="css/icons.css">
    <!-- Path to your custom app styles-->
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <div id="app">

        <div class="statusbar"></div>

        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <div class="navbar">
                <div class="navbar-bg bg-color-blue"></div>
                <div class="navbar-inner bg-color-blue">
                    <div class="left">
                        <div class="title"><a href='/index/'>Stock Up</a></div>
                    </div>
                    <div class="right">
                        <i class="f7-icons">cart_fill</i>
                        <div class="block block-strong-ios block-outline-ios">
                            <p class="grid grid-cols-2 grid-gap">
                                <a href="#" data-panel=".panel-right" class="panel-open">
                                    <i class="f7-icons ellipsis-btn">ellipsis_vertical</i>
                                </a>
                            </p>
                        </div>
                    </div>
                    <!-- Statusbar overlay -->



                </div>


            </div>


            <!-- Right Panel with Cover effect -->
            <div class="panel panel-right panel-cover panel-init">
                <div class="block">
                    <a href='/cuenta/'><button class="button color-blue panel-close">Mi cuenta</button></a>
                    <br>
                    <a href='/negocio/'><button class="button color-blue panel-close">Mi negocio</button></a>
                    <br>
                    <a href='/registrarnegocio/'><button class="button color-blue panel-close">Registrar mi
                            negocio</button></a>
                    <br>
                    <br>
                    <a href="#" class="panel-close"><button class="button color-red panel-close">Volver</button></a>
                </div>
            </div>

            <!--pie-->
            <div class="toolbar tabbar-icons toolbar-bottom">
                <div class="toolbar-inner">
                    <a href="/tarjetas/" class="tab-link tab-link-active">
                        <i class="f7-icons">creditcard</i>
                        <span class="tabbar-label">Mis Tarjetas</span>
                    </a>
                    <a href="/compras/" class="tab-link">
                        <i class="f7-icons">cart</i>
                        <span class="tabbar-label">Mis compras</span>
                    </a>
                    <a href="/favoritos/" class="tab-link">
                        <i class="f7-icons">star</i>
                        <span class="tabbar-label">Mis favoritos</span>
                    </a>
                    <a href="/cuenta/" class="tab-link">
                        <i class="f7-icons">person_crop_circle_fill</i>
                        <span class="tabbar-label">Mi perfil</span>
                    </a>
                </div>
            </div>


            <div data-name="index" class="page">
                <!-- Scrollable page content -->
                <div class="page-content">
                    <div class="block">

                        <!-- CONTENIDO DEMO -->


                        <div class="centro">
                            <h1>¡HOLA!</h1>
                        </div>
                        <div class="list list-strong-ios list-dividers-ios inset-ios">
                            <ul>
                                <li class="item-content item-input">
                                    <div class="item-inner">
                                        <div class="item-title item-label">E-mail</div>
                                        <div class="item-input-wrap">
                                            <input type="email" placeholder="Introduce tu correo">
                                            <span class="input-clear-button"></span>
                                        </div>
                                    </div>
                                </li>
                                <li class="item-content item-input">
                                    <div class="item-inner">
                                        <div class="item-title item-label">Clave</div>
                                        <div class="item-input-wrap">
                                            <input type="password" placeholder="Introduce tu contraseña">
                                            <span class="input-clear-button"></span>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        <a href='/olvidecontrasenia/'><button class="button color-blue">¿Olvidaste tu
                                contraseña?</button></a>
                        <br>
                        <a href='/codeseisdeuna/'><button class="button button-fill button-round">Iniciar
                                sesión</button></a>
                        <br>
                        <br>
                        <div class="centro">
                            <p>¿Todavía no tienes una cuenta?</p>
                        </div>
                        <a href='/registro/'><button class="button color-blue">Registrarse</button></a>
                    </div>




                </div>
            </div>




        </div>

        <script type="text/javascript" src="cordova.js"></script>
        <script type="text/javascript" src="lib/framework7/framework7-bundle.min.js"></script>
        <!--<script type="text/javascript" src="lib/framework7/framework7.js"></script>-->
        <script type="text/javascript" src="js/my-app.js"></script>
</body>

</html>

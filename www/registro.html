<!-- We don't need a full layout in this file because this page will be parsed with Ajax. -->
<div class="page" data-name="registro">
    <div class="navbar">
        <div class="navbar-inner sliding">
            <div class="left">
                <a href="#" class="link back">
                    <i class="icon icon-back"></i>
                    <span class="ios-only">Back</span>
                </a>
            </div>
            <div class="title">Registro</div>
        </div>
    </div>
    <div class="page-content">
        <div class="centro">
            <h1>¡HOLA!</h1>
        </div>
        <div class="list list-strong-ios list-dividers-ios inset-ios">
            <ul>
                <li class="item-content item-input">
                    <div class="item-inner">
                        <div class="item-title item-label">E-mail</div>
                        <div class="item-input-wrap">

                        </div>
                    </div>
                </li>
                <li class="item-content item-input">
                    <div class="item-inner">

                        </div>
                    </div>
                </li>
                <li class="item-content item-input">
                    <div class="item-inner">
                        <div class="item-title item-label">Apellido</div>

                    </div>
                </li>
                <li class="item-content item-input">
                    <div class="item-inner">
                        <div class="item-title item-label">Clave</div>
                        <div class="item-input-wrap">
                            <input type="password" id="passwordreg" placeholder="Introduce tu contraseña">

                    </div>

            </ul>

        <a href='/inicio/'><button class="button button-fill button-round" id="botonregistro">Registrarse</button></a>
